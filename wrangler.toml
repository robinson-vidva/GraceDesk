name = "gracedesk"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Static assets (public/) served directly by the Worker runtime.
assets = { directory = "./public", binding = "ASSETS" }

# Custom domain. Cloudflare creates the DNS record and certificate automatically
# because askdevotions.com is a zone on this account. Self-hosting elsewhere:
# change this to your own hostname, or remove it to use the workers.dev URL.
routes = [{ pattern = "gracedesk.askdevotions.com", custom_domain = true }]

# ---------------------------------------------------------------------------
# Cloudflare D1 (SQLite) — the application database.
# For local dev, Wrangler creates a local SQLite file automatically; no cloud
# resource is required. Before deploying, run:  wrangler d1 create gracedesk
# and paste the returned database_id below.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "gracedesk"
database_id = "37981c1d-cac5-400d-a66c-e9c9807d6d74"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# Cloudflare R2 — object storage for church logos and cached PDF reports.
# Optional: the app runs without it (logos disabled, PDFs built fresh each time).
# To enable: turn on R2 in the dashboard, run
#   wrangler r2 bucket create gracedesk-files
# then uncomment the binding below and redeploy.
# ---------------------------------------------------------------------------
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "gracedesk-files"

# Daily jobs: birthday/anniversary greetings, and monthly summaries on the 1st.
[triggers]
crons = ["0 13 * * *"]

[vars]
# Non-secret defaults. Secrets (RESEND_API_KEY, TURNSTILE_SECRET_KEY,
# SESSION_SECRET, ADMIN_PASSWORD) go in .dev.vars locally and
# `wrangler secret put` in production.
APP_NAME = "GraceDesk"
# Canonical public URL, used in email links. Match the custom domain above.
APP_URL = "https://gracedesk.askdevotions.com"
